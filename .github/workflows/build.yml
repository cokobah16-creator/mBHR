name: Build Check

on:
  pull_request:
  push:
    branches:
      - main
      - mainone

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:run

      - name: i18n completeness check
        run: npm run i18n:check

      - name: Build
        run: npm run build
