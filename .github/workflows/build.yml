name: Build & Deploy

on:
  pull_request:
  push:
    branches:
      - main
      - mainone

# Concurrency: cancel in-progress runs for the same ref so a fast follow-up
# push doesn't pile up parallel deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:run

      - name: i18n completeness check
        run: npm run i18n:check

      # Advisory on PRs and feature branches, blocking on anything that can
      # reach production. The outstanding advisories are all in transitive
      # dependencies and clearing them needs a lockfile refresh (`npm audit
      # fix`), including at least one breaking major bump, so no feature branch
      # can turn this green on its own; the report still runs and a failed step
      # is flagged on the run, it just does not gate merges.
      #
      # The condition below deliberately mirrors the `if:` on migrate-prod /
      # deploy-prod, which this job gates via `needs: build`. Keep the two in
      # sync: if the production jobs start triggering off another branch, this
      # must follow, or critical advisories reach production unchecked.
      - name: Security audit
        run: npm audit --audit-level=critical
        continue-on-error: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Smoke test (every PR). Runs Playwright against the dist/ artifact the
  # build job produced, served locally by the config's webServer block.
  #
  # This deliberately does not deploy: Vercel's own GitHub integration
  # already publishes a preview for every PR, so a second CI-side deploy
  # duplicated those builds and required VERCEL_TOKEN / VERCEL_ORG_ID /
  # VERCEL_PROJECT_ID. Testing the built bundle locally needs no
  # credentials and is deterministic, at the cost of not exercising
  # Vercel's rewrites and headers.
  # ------------------------------------------------------------------
  smoke-test:
    name: Smoke test
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reuse the exact bundle the build job produced rather than rebuilding.
      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run login smoke test
        env:
          CI: '1'
        run: npx playwright test e2e/login.spec.ts --project=chromium

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: playwright-report/
          retention-days: 7

  # ------------------------------------------------------------------
  # Production deploy + DB migrate. Only on main; gated by the
  # `production` GitHub Environment so a human approves before either
  # the migrate or the deploy runs.
  # ------------------------------------------------------------------
  migrate-prod:
    name: Apply DB migrations (prod)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-prod:
    name: Deploy production
    needs: migrate-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
