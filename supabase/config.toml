# Supabase CLI project configuration
# https://supabase.com/docs/guides/cli/config
#
# To find your project_id:
#   supabase projects list
# Then replace the placeholder below and commit the file.

project_id = "dlogqxzejroeyivfmgcv"

[api]
# The port the local API gateway listens on
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Local Postgres port (used by supabase start)
port = 54322
[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
# Where Supabase Auth sends users when an email link's redirect URL is not on
# the allow list below (and the default for links that name no redirect).
# This file only configures the local stack (`supabase start`); the hosted
# project is configured in the dashboard under Authentication -> URL
# Configuration. Keep the two in step. See docs/PASSWORD_RECOVERY.md.
site_url = "http://localhost:5173"
# Every URL the app passes as redirectTo / emailRedirectTo must match an entry
# here exactly or by wildcard, or Supabase silently falls back to site_url.
# The reset link carries ?for=staff|patient, so its entry ends in `**`, which
# matches a query string (`*` never crosses `.` or `/`). URLs on site_url's own
# host are always accepted.
# No wildcard hosts: Vercel hands out *.vercel.app project names and team slugs
# first come, first served, so even "https://*-<team>.vercel.app/**" can be
# claimed by a stranger and would receive this project's recovery tokens. A
# reset link opened from a preview deployment falls back to site_url, where
# the production app completes the reset.
# Production is https://mbhr.app; m-bhr.vercel.app is the old Vercel alias,
# which now redirects there (browsers keep the URL fragment, so the token
# survives), and stays listed for links that were sent before the move.
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password**",
  "https://mbhr.app/auth/callback",
  "https://mbhr.app/reset-password**",
  "https://m-bhr.vercel.app/auth/callback",
  "https://m-bhr.vercel.app/reset-password**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true

[analytics]
enabled = false
