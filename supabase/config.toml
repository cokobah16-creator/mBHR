# Supabase CLI project configuration
# https://supabase.com/docs/guides/cli/config
#
# To find your project_id:
#   supabase projects list
# Then replace the placeholder below and commit the file.

project_id = "dlogqxzejroeyivfmgcv"

[api]
# The port the local API gateway listens on
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Local Postgres port (used by supabase start)
port = 54322
[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
# The URL that Supabase Auth redirects to after email confirmation.
# Set this to your Vercel deployment URL in production.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "https://*.vercel.app/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true

[functions.flush-reminders]
# Invoked by pg_cron via pg_net with no stored key: the drain is benign
# (sends only already-due reminders), rate-limited, and uses the service
# role internally. See migration 20260813190000_add_reminder_flush_cron.sql.
verify_jwt = false

# TEFCA functions authenticate at the app layer with externally issued
# SMART Backend Services bearer tokens (introspected against
# oauth_access_tokens) — Supabase JWT verification must be off for those
# tokens to reach the handler. Recorded here so the deployed posture is
# explicit. If no TEFCA partner is active, prefer undeploying all three
# (`supabase functions delete tefca-ias tefca-bulk tefca-oauth`).
[functions.tefca-ias]
verify_jwt = false
[functions.tefca-oauth]
verify_jwt = false
[functions.tefca-bulk]
verify_jwt = false

[analytics]
enabled = false
